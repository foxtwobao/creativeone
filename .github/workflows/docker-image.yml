name: Server Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "web/**"
      - "server/**"
      - "deploy/**"
      - "docker-compose*.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "VERSION"
      - "CHANGELOG.md"
      - ".github/workflows/docker-image.yml"
  pull_request:
    paths:
      - "web/**"
      - "server/**"
      - "deploy/**"
      - "docker-compose*.yml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/creativeone
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-
      - name: Build and push server edition
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=creativeone
          cache-to: type=gha,mode=max,scope=creativeone
