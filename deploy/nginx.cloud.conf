server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # The application validates JSON and media sizes separately.
    client_max_body_size 0;
    location /assets/ {
        try_files $uri =404;
    }
    location /icons/ {
        try_files $uri =404;
    }
    # Authentication URLs contain one-time codes; omit query/body and upstream error logs.
    location ^~ /api/auth/reseller/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:4011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
    }
    location ^~ /api/model-authorization {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:4011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
