name: creativeone-cloud
services:
  app:
    image: ${APP_IMAGE:-creativeone:local}
    ports:
      - "${APP_PORT:-3001}:3000"
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://creativeone:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/creativeone
      MEDIA_DIR: /app/data/media
    volumes:
      - media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: creativeone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: creativeone
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creativeone -d creativeone"]
    restart: unless-stopped
volumes:
  postgres:
  media:
