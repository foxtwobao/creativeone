name: creativeone-cloud
services:
  app:
    image: ${APP_IMAGE:-creativeone:local}
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      # 对外访问地址与 IDONE 登录配置（来自根目录 .env）。
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN}
      APP_ORIGINS: ${APP_ORIGINS:-}
      APP_DOMAIN_SUFFIXES: ${APP_DOMAIN_SUFFIXES:-}
      RESELLER_APP_ID: ${RESELLER_APP_ID:-creativeone}
      IDONE_ISSUER: ${IDONE_ISSUER:?Set IDONE_ISSUER}
      IDONE_DISCOVERY_URL: ${IDONE_DISCOVERY_URL:-}
      IDONE_CLIENT_ID: ${IDONE_CLIENT_ID:?Set IDONE_CLIENT_ID}
      IDONE_CLIENT_SECRET: ${IDONE_CLIENT_SECRET:?Set IDONE_CLIENT_SECRET}
      ADMIN_SUBJECTS: ${ADMIN_SUBJECTS:?Set ADMIN_SUBJECTS}
      # Reseller 公开 origin 用于登录；应用凭证与模型地址留空时仅启用登录与数据同步。
      ENHANCER_BASE_URL: ${ENHANCER_BASE_URL:?Set ENHANCER_BASE_URL}
      ENHANCER_APP_CREDENTIAL: ${ENHANCER_APP_CREDENTIAL:-}
      ENHANCER_PREVIOUS_APP_CREDENTIALS: ${ENHANCER_PREVIOUS_APP_CREDENTIALS:-[]}
      ONE_NAVIGATION_CONFIG: ${ONE_NAVIGATION_CONFIG:-}
      TOKENONE_BASE_URL: ${TOKENONE_BASE_URL:-}
      MAX_REFERENCE_IMAGE_BYTES: ${MAX_REFERENCE_IMAGE_BYTES:-10485760}
      PROMPT_GITHUB_PROXY_BASE: ${PROMPT_GITHUB_PROXY_BASE-https://gh-proxy.com/}
      MEDIA_DOWNLOAD_HOSTS: ${MEDIA_DOWNLOAD_HOSTS:-}
      # 数据库连接自动组装；内部目录、端口及运行边界使用镜像/程序默认值。
      DATABASE_URL: postgresql://creativeone:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/creativeone
    volumes:
      - media:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: creativeone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: creativeone
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creativeone -d creativeone"]
    restart: unless-stopped
volumes:
  postgres:
  media:
